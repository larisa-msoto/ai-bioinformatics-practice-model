# -----------------------------------------------------------------------------
# 4D-Bio: A Practice Model for AI-Augmented Bioinformatics
# -----------------------------------------------------------------------------
site_name: 4D-Bio
site_url: https://larisa-msoto.github.io/ai-bioinformatics-practice-model/
repo_url: https://github.com/larisa-msoto/ai-bioinformatics-practice-model
edit_uri: 'blob/main/docs/'
docs_dir: docs/
site_description: "4D-Bio is a community-maintained practice model that maps the skills of a practicing bioinformatician onto Anthropic's 4D framework for AI fluency."
site_author: Larisa M. Soto
copyright: >-
  A project of the
  <a href="https://bioinfopro.org">Association of Bioinformatics Professionals</a>.
  Content is licensed under
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>,
  based on the
  <a href="https://www.anthropic.com/learn/claude-for-you">AI Fluency Framework</a>
  by Rick Dakan, Joseph Feller, and Anthropic.

nav:
  - Home: index.md
  - The model:
      - Overview: overview.md
      - Delegation: delegation.md
      - Description: description.md
      - Discernment: discernment.md
      - Diligence: diligence.md
      - References: references.md
  - Contribute:
      - How to contribute: contributing.md
      - Contributors: contributors.md
      - Code of conduct: code_of_conduct.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn  # New in MkDocs 1.6
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  locale: en
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

  # Single light palette only — the BioinfoPro design system defines five
  # colours and no dark mode. Brand hues are applied in stylesheets/extra.css.
  palette:
    scheme: default
    primary: custom
    accent: custom


extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 2
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - attr_list
  - md_in_html
