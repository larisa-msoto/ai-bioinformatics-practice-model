# -----------------------------------------------------------------------------
# 4D-Bio: A Practice Model for AI-Augmented Bioinformatics
# -----------------------------------------------------------------------------
site_name: 4D-Bio
site_url: https://larisa-msoto.github.io/ai-bioinformatics-practice-model/
repo_url: https://github.com/larisa-msoto/ai-bioinformatics-practice-model
edit_uri: 'blob/main/docs/'
docs_dir: docs/
site_description: "4D-Bio is a community-maintained practice model that maps the skills of a practicing bioinformatician onto Anthropic's 4D framework for AI fluency."
site_author: Larisa M. Soto

nav:
  - Home: index.md
  - The Model:
      - Overview: overview.md
      - Delegation: delegation.md
      - Description: description.md
      - Discernment: discernment.md
      - Diligence: diligence.md
      - References: references.md
  - Contribute:
      - How to Contribute: contributing.md
      - Contributors: contributors.md
      - Code of Conduct: code_of_conduct.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn  # New in MkDocs 1.6
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  locale: en
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

  palette:
      # 1. Light Mode Configuration
      - media: "(prefers-color-scheme: light)"
        scheme: default
        primary: indigo        # You can change this to indigo, teal, etc.
        accent: deep purple
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode

      # 2. Dark Mode Configuration
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: indigo
        accent: deep purple
        toggle:
          icon: material/brightness-4
          name: Switch to light mode


plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false

markdown_extensions:
  - toc:
      permalink: true
      baselevel: 2
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - attr_list
  - md_in_html
